<style>

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.5;margin:0}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;margin-bottom:8px}
.top{gap:22px}

.t li.hl{font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--hpc) 32%,transparent);border-radius:4px;box-shadow:0 0 0 3px color-mix(in srgb,var(--hpc) 32%,transparent)}
.lgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:42px;margin-bottom:6px}.lgrow .legend{margin:0}.nav{display:flex;gap:8px;flex:none}.nav .btn{padding:7px 16px;font-size:1rem}.nav .btn:disabled{opacity:.45;cursor:default}
:root{--ims-t:#5B3A91;--mtx-t:#8A4A00;--stroma-t:#2E6B22;--ims:#E3D3F3;--mtx:#FFE0B0;--stroma:#E2F0DA;--thy:#D6E8F8;--hpc:#8FB000;--sp-e:#A87900;--sp-h:#C62828;--sp-n:#1F66A8;--sp-a:#B85C00;--sp-w:#00798A;--sp-c:#6B4FB8}
:root[data-theme=dark],:root[data-theme=amoled],:root[data-theme=hc]{--ims-t:#CDB9F5;--mtx-t:#F2BE72;--stroma-t:#8FD99A;--ims:#2B2145;--mtx:#42301A;--stroma:#1B2E22;--thy:#15294A;--hpc:#C6F135;--sp-e:#F2CB45;--sp-h:#FF7B7B;--sp-n:#6DB8FF;--sp-a:#FFA85A;--sp-w:#55D6E6;--sp-c:#C4A8FF}
.sp-e{color:var(--sp-e)}.sp-h{color:var(--sp-h)}.sp-n{color:var(--sp-n)}.sp-a{color:var(--sp-a)}.sp-w{color:var(--sp-w)}.sp-c{color:var(--sp-c)}
.spkey{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;font-weight:700;margin-top:.3rem}.spkey span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:5px}
.ihead .btn{white-space:nowrap;flex:none}

.spk span::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:currentColor}
.sec b{font-size:.84rem!important;color:var(--accent)!important;letter-spacing:.07em;border-bottom:2px solid var(--line);padding-bottom:3px}

@media(max-width:960px){.lc,.dg,.panel,#svgbox,.grid>*{min-width:0;max-width:100%}.lgrow{flex-wrap:wrap}.lgrow .legend{flex:1 1 100%}.legend span{white-space:normal}.nav{margin-left:auto}}
:root[data-theme=amoled]{--bg:#000;--surface:#080808;--surface-2:#131313;--line:#2C2C2C;--accent-soft:#10202F;--accent-ink:#000;--good-soft:#0C2219;--bad-soft:#2A120D;--cf-p:#1C1733;--cf-d:#2A200B;--cf-n:#0B2428;color-scheme:dark}

<body><div class="wrap">
<h1 class="sr">Mitochondrion and Chloroplast Diagrams</h1>
<div class="top"><span class="startpill">Start here <span aria-hidden="true">&#10140;</span></span><div class="grp"><span class="lab">1. Pick a diagram</span><div class="tabs" role="tablist" id="tabs" aria-label="Diagram"></div></div><div class="grp modes" id="modes"></div><button class="tab" id="theme" style="margin-left:auto" aria-pressed="false"></button></div>
<div class="grid"><div class="lc"><div class="panel dg"><div class="lgrow"><div class="legend" id="legend"></div><div class="nav" id="nav"></div></div><div id="svgbox"></div><button class="hq" id="hq"></button></div>
<div class="panel hp"><h2>Helpful information</h2><ul class="t small" id="help"></ul>
<details><summary>Layout description (for screen readers and text only use)</summary><ol class="t small" id="lay"></ol></details></div></div>
<div class="panel rp"><div class="row ihead" style="justify-content:space-between"><b id="info"></b><button class="btn ghost small" id="reset">Reset this diagram</button></div><div class="spk" id="spk" aria-label="Color key for equations"></div><div id="bar" style="margin-top:8px"></div></div></div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mq=matchMedia('(prefers-color-scheme:dark)');let theme=mq.matches?'dark':'light',picked=false;
function applyTheme(){document.documentElement.dataset.theme=theme;const b=$('#theme');b.textContent=theme==='light'?'Dark mode':'Light mode';b.setAttribute('aria-pressed',theme==='light')}
$('#theme').onclick=()=>{picked=true;theme=theme==='light'?'dark':'light';applyTheme()};
mq.addEventListener&&mq.addEventListener('change',e=>{if(!picked){theme=e.matches?'dark':'light';applyTheme()}});applyTheme();
const EMB=window.parent!==window;
if(EMB){document.documentElement.classList.add('emb');
 addEventListener('message',e=>{const d=e.data;if(d&&d.type==='theme'&&(['dark','light','amoled','hc'].includes(d.theme))){picked=true;theme=d.theme;applyTheme()}});
 const sendH=()=>{if(innerWidth<=960)parent.postMessage({type:'h',h:document.documentElement.scrollHeight},'*')};
 addEventListener('load',()=>{parent.postMessage({type:'ready'},'*');sendH();window.ResizeObserver&&new ResizeObserver(sendH).observe(document.body)});addEventListener('resize',sendH)}
/* blank constructors */
const proc=(id,x,y,w,h,ans,why,d,seed)=>({id,k:'proc',sh:'wavy',x,y,w,h,ans,why,d:'Process box: '+d,seed:seed||1});
const prod=(id,x,y,w,h,ans,why,d)=>({id,k:'prod',sh:'rect',x,y,w,h,ans,why,d:'Name box for '+d});
const num=(id,cx,cy,r,ans,why,d,near)=>({id,k:'num',sh:'circ',cx,cy,r,ans:String(ans),why,d:'Quantity circle for '+d,near:near||{}});
const item=(n,c,r,name,qty,wn,wq,where)=>[prod(n+'n',r[0],r[1],r[2],r[3],name,wn,where),num(n+'q',c[0],c[1],c[2],qty,wq,where)];
const boxOf=b=>b.sh==='circ'?[b.cx-b.r,b.cy-b.r,2*b.r,2*b.r]:[b.x,b.y,b.w,b.h];

/* wavy outline */
function wavy(x,y,w,h,s){const r=26,pts=[];let i=0;const j=a=>{i++;return a*Math.sin(i*2.3+s*1.7)+a*.5*Math.sin(i*5.1+s)};
 const edge=(x0,y0,x1,y1,nx,ny)=>{const L=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.round(L/75));for(let k=0;k<=n;k++){const t=k/n,o=j(4);pts.push([x0+(x1-x0)*t+nx*o,y0+(y1-y0)*t+ny*o])}};
 edge(x+r,y,x+w-r,y,0,1);edge(x+w,y+r,x+w,y+h-r,1,0);edge(x+w-r,y+h,x+r,y+h,0,1);edge(x,y+h-r,x,y+r,1,0);
 const n=pts.length,f=v=>v.toFixed(1);let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
 for(let k=0;k<n;k++){const p0=pts[(k-1+n)%n],p1=pts[k],p2=pts[(k+1)%n],p3=pts[(k+2)%n];
  d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}
 return d+'Z'}
/* thick arrow / line helpers (fill = foreground) */
function thick(x0,y0,x1,y1,w,head){const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,hl=head?w*1.9:0,hw=w*1.5,bx=x1-ux*hl,by=y1-uy*hl;
 const P=[[x0+px*w/2,y0+py*w/2],[bx+px*w/2,by+py*w/2]];if(head)P.push([bx+px*hw,by+py*hw],[x1,y1],[bx-px*hw,by-py*hw]);P.push([bx-px*w/2,by-py*w/2],[x0-px*w/2,y0-py*w/2]);
 return `<polygon points="${P.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="var(--fg)"/>`}
const thin=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--fg)" stroke-width="3" marker-end="url(#ah)"/>`;
const dotted=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--muted)" stroke-width="6" stroke-dasharray="4 9" stroke-linecap="round" marker-end="url(#ahm)"/>`;
const dashed=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="var(--muted)" stroke-width="5" stroke-dasharray="16 11" marker-end="url(#ahm)"/>`;
const lines=s=>{if(s.length<=15||!s.includes(' '))return[s];const m=s.length/2;let best=0,bd=99;[...s].forEach((c,i)=>{if(c===' '&&Math.abs(i-m)<bd){bd=Math.abs(i-m);best=i}});return[s.slice(0,best),s.slice(best+1)]};
const TX=(cx,cy,s,sz,wt,extra)=>{const L=lines(String(s));return L.map((l,i)=>`<text x="${cx}" y="${(cy+(i-(L.length-1)/2)*sz*1.15+sz*.35).toFixed(1)}" text-anchor="middle" font-size="${sz}" font-weight="${wt||700}" fill="var(--fg)" ${extra||''} style="pointer-events:none">${esc(l)}</text>`).join('')};
const LBL=(x,y,s,sz,style)=>`<text x="${x}" y="${y}" font-size="${sz}" ${style||'font-weight="700"'} fill="var(--fg)">${s}</text>`;
const BLU=(x,y,s,z)=>`<text x="${x}" y="${y}" font-size="${z||32}" font-style="italic" fill="var(--accent)">${s}</text>`;

 B.push(num('e',503,312,44,24,'The Calvin cycle for 1 glucose needs 12 NADPH, and each NADPH takes 2 e⁻: 24 e⁻.','the electron box',{12:'12 is the NADPH made. Each NADPH takes 2 electrons, so double it.'}));
 B.push(num('c',602,508,68,6,'Glucose has 6 carbons and each turn fixes one CO₂: 6 CO₂.','the CO₂ box',{1:'1 is the glucose. It takes 6 CO₂ to build its 6 carbons.'}));

 start:{hp:[5],title:'Start here: 1 glucose',w:'Everything on this worksheet is counted for 1 glucose, so begin at Glucose (top right, in the cytoplasm). From there, follow the thick arrows. Each step fills in one blank and explains why it goes there. Purple wavy boxes are processes or protein complexes, gold rectangles are products, and teal circles are numbers.'},
 gly:{s:['glc'],sl:'The glucose that goes in',w:'The thick arrow from Glucose points into this box, and the box sits in the cytoplasm, outside the mitochondrion. The only stage that takes glucose itself is glycolysis, so it goes here. Its products are drawn to the left and below.',n:'Pyruvate oxidation and the citric acid cycle take pyruvate and acetyl-CoA, not glucose, and they happen inside the matrix. The ETC and ATP synthase are membrane protein complexes inside the mitochondrion.',c:'"Stages of Cellular Respiration" slide: glycolysis splits 1 glucose into 2 pyruvate and sends e⁻ to the ETC.'},
 i3n:{s:['gly'],sl:'The glycolysis box that makes it',w:'A thick arrow leaves glycolysis and ends at this box, and the next thick arrow carries it into the mitochondrion. Pyruvate is what glycolysis ends with.',n:'Acetyl-CoA is made later by pyruvate oxidation, and glucose was already used up, so neither fits here.',c:'"Stages of Cellular Respiration" slide: glycolysis splits 1 glucose into 2 pyruvate.'},
 i3q:{hp:[5],h:['eq:1 glucose → 2 pyruvate','Glycolysis splits the 6-carbon glucose into two 3-carbon pyruvate.','This 2 is reused in the next three stages.','src:The starting glucose'],s:['glc'],c:'"Stages of Cellular Respiration" slide: 1 glucose into 2 pyruvate.'},
 i1n:{s:['gly'],sl:'The glycolysis box that makes it',w:'This box is a product of glycolysis (an arrow points to it) and it has no dotted arrow, so it does not carry electrons. The glycolysis product with no dotted arrow is ATP.',n:'NADH has a dotted arrow to the electron box, and it is in the box below. CO₂ is not released here: both pyruvate keep all 3 of their carbons.'},
 i1q:{s:['gly'],h:['eq:4 ATP made − 2 ATP spent = 2 ATP','Glycolysis makes 4 ATP and spends 2.','The worksheet counts the net gain.','src:The glycolysis box'],c:'Lecture 20 overview slide shows 2 ATP leaving glycolysis.'},
 i2n:{s:['gly'],sl:'The glycolysis box that makes it',w:'The dotted arrow leaving this box goes to the electron box. Only the electron carriers (NADH and FADH₂) send electrons there, and glycolysis makes NADH.',n:'FADH₂ is made only in the citric acid cycle. ATP is already in the box above and carries no electrons.',c:'"Stages of Cellular Respiration" slide: glycolysis sends electrons via NADH.'},
 i2q:{h:['eq:1 NADH × 2 pyruvate = 2 NADH','1 NADH is made per pyruvate.','src:The pyruvate number'],s:['i3q']},
 po:{s:['i3n'],sl:'The pyruvate that goes in',w:'The thick arrow carries pyruvate into the matrix, and this is the first process box inside the mitochondrion. Its output (acetyl-CoA) is the box below, so this is the stage that converts pyruvate to acetyl-CoA.',n:'Glycolysis is outside the mitochondrion. The citric acid cycle needs acetyl-CoA as its input, but the box above this one holds pyruvate.',c:'"Mitochondrion Anatomy" slide: pyruvate oxidation happens in the matrix. "Stages" slide: converts 2 pyruvate into 2 acetyl-CoA.'},

 i5n:{s:['po'],sl:'The pyruvate oxidation box that makes it',w:'This box has a dotted arrow to the electron box, so it holds an electron carrier. Pyruvate is oxidized here, and its electrons go to NAD⁺ to make NADH.',n:'FADH₂ is not made at this stage. It comes only from the citric acid cycle.',c:'"Electron Transport Chain" slide: NAD⁺ accepts 2 e⁻, and NADH carries 2 e⁻.'},
 i5q:{h:['eq:1 NADH × 2 pyruvate = 2 NADH','1 NADH is made per pyruvate.','src:The pyruvate number'],s:['i3q']},
 i6n:{s:['po'],sl:'The pyruvate oxidation box that makes it',w:'The thick arrow from pyruvate oxidation ends here, and the next arrow feeds the citric acid cycle. Acetyl-CoA is the product of pyruvate oxidation.',n:'Pyruvate was the input to the stage above, so it no longer fits.'},
 i6q:{h:['eq:1 acetyl-CoA × 2 pyruvate = 2 acetyl-CoA','Each pyruvate becomes 1 acetyl-CoA.','src:The pyruvate number'],s:['i3q'],c:'"Stages of Cellular Respiration" slide: 2 pyruvate into 2 acetyl-CoA.'},
 cac:{s:['i6n'],sl:'The acetyl-CoA that goes in',w:'It sits right below acetyl-CoA, which is its input, and it has four products. The cycle that finishes breaking acetyl-CoA down to CO₂ is the citric acid cycle.',n:'The ETC and ATP synthase are the membrane complexes with H⁺ arrows. Pyruvate oxidation already happened above.',c:'"Stages of Cellular Respiration" slide: converts 2 acetyl-CoA into 4 CO₂ and sends e⁻ to the ETC.'},

 i8q:{h:['eq:1 ATP per turn × 2 turns = 2 ATP','The cycle turns once per acetyl-CoA, so 2 turns.','src:The acetyl-CoA number'],s:['i6q'],c:'Lecture 20 overview slide shows 2 ATP from the citric acid cycle.'},
 i9n:{s:['cac'],sl:'The citric acid cycle box that makes it',w:'This box and the one below it both have dotted arrows, so they are the two electron carriers. FADH₂ is made only by the citric acid cycle, and this worksheet lists it above NADH.',n:'Glycolysis and pyruvate oxidation make NADH but never FADH₂, which is why FADH₂ appears only in this column.'},

function explain(b,c,ok){const D=DG[cur];let t=whyOf(b),tgt=b.sh?[boxOf(b)]:[],alt=[];

  else{const other=all().filter(x=>x.k===b.k&&x.ans===c&&x.id!==b.id);
   if(other.length){alt=other.map(boxOf);t=`${c} belongs at the dashed outline${other.length>1?'s':''}. This one is ${b.ans}. ${t}`}
   else t=`${c} is not here${D.DEF[c]?': '+D.DEF[c]:'.'} This one is ${b.ans}. ${t}`}}
 else if(b.k!=='num')t=`${b.ans}. ${t}`;
 return {t,tgt,alt}}

const sents=t=>t?String(t).split(/(?<=[.!?])\s+(?=[A-Z"])/):[];
function bl(a){a=a.filter(Boolean);return a.length?`<ul class="bl">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
const SPN={e:'Electrons (e⁻)',h:'Protons (H⁺)',n:'Carriers',a:'ATP',w:'Water, oxygen',c:'Carbon molecules'};const SPT={n:'NADH, FADH₂, NADPH',c:'CO₂, glucose, pyruvate, acetyl-CoA, RuBP, 3PG, G3P',w:'H₂O, O₂'};
const SPR=/(NADPH|NADH|FADH₂|acetyl-CoA|pyruvate|glucose|CO₂|H₂O|O₂|3PG|G3P|RuBP|ATP|e⁻|H⁺)/g;
const spc=m=>/^(e⁻)$/.test(m)?'e':/^H⁺$/.test(m)?'h':/^(NADPH|NADH|FADH₂)$/.test(m)?'n':m==='ATP'?'a':/^(H₂O|O₂)$/.test(m)?'w':'c';
function fmtH(arr,withSrc){let h='',li=[];const used=new Set();const fl=()=>{h+=bl(li);li=[]};
 arr.forEach(x=>{if(x.startsWith('eq:')){fl();h+=`<div class="eq">${esc(x.slice(3)).replace(SPR,m=>{const k=spc(m);used.add(k);return `<span class="sp-${k}">${m}</span>`})}</div>`}else if(x.startsWith('src:')){fl();if(withSrc)h+=`<div class="srcl">Pink outline: ${esc(x.slice(4))}</div>`}else li.push(x)});fl();
 return h}
const whyOf=b=>{const g=DG[cur].GM&&DG[cur].GM[b.id];return b.k==='num'&&g&&g.h?fmtH(g.h,false):b.why};
const goto=i=>{const S=ST[cur];S.step=Math.max(0,Math.min(DG[cur].guide.length-1,i));S.seen.add(S.step);render()};
function vis(id){const S=ST[cur],D=DG[cur],i=D.gi[id];if(i==null)return false;if(S.seen.has(i))return true;return ((D.GM[D.guide[S.step]]||{}).s||[]).includes(id)}
function legend(){const sv=x=>`<svg width="42" height="26" viewBox="0 0 42 26" aria-hidden="true">${x}</svg>`;
 return `<span>${sv('<path d="M4 7C10 2 15 10 21 6S34 3 38 8L37 20C31 24 25 17 20 22S9 23 4 19Z" fill="var(--cf-p)" stroke="var(--cs-p)" stroke-width="2.5"/>')}Process or protein complex</span><span>${sv('<rect x="4" y="5" width="34" height="16" fill="var(--cf-d)" stroke="var(--cs-d)" stroke-width="1.8"/>')}Product</span><span>${sv('<circle cx="21" cy="13" r="10" fill="var(--cf-n)" stroke="var(--cs-n)" stroke-width="1.4"/>')}Number (quantity)</span>`}
function render(){const S=ST[cur],D=DG[cur],L=all(),G=gmode(),done=L.filter(b=>S.S[b.id]!=null).length,ft=L.filter(b=>S.first[b.id]===1).length;
 $('#legend').innerHTML=legend();
 $('#modes').innerHTML=D.guide?`<span class="lab">2. Pick a mode</span>`+[['guide','Guide me'],['test','Test your knowledge']].map(m=>`<button class="tab" role="tab" aria-selected="${S.mode===m[0]}" data-m="${m[0]}">${m[1]}</button>`).join(''):'';
 $$('[data-m]').forEach(x=>x.onclick=()=>{S.mode=x.dataset.m;render()});
 $('#spk').innerHTML=Object.keys(SPN).map(k=>`<span class="sp-${k}" title="${SPT[k]||''}">${SPN[k]}</span>`).join('')+(G?`<hr><span class="kk"><i style="background:var(--hl);border-color:var(--hl)"></i>This step</span><span class="kk"><i style="border-color:var(--src)"></i>Where it comes from</span><span class="kk"><i style="background:var(--hpc);border-color:var(--hpc)"></i>Used from Helpful information</span>`:'');$('#nav').innerHTML=G?`<button class="btn" id="gprev" ${S.step===0?'disabled':''}>Back</button><button class="btn primary" id="gnext" ${S.step===D.guide.length-1?'disabled':''}>Next step</button>`:'';$('#svgbox').innerHTML=svg();$('#bar').innerHTML=G?guideBar():bar();
 $('#info').textContent=G?'Guide me':`${done} of ${L.length} blanks finished, ${ft} right on the first try`;
 $('#reset').textContent=G?'Restart guide':'Reset this diagram';
 const hq=$('#hq'),gi=D.gi||{};let hs=false,hsrc=false,hsel=false;
 if(G){hs=vis('hq');hsel=D.guide[S.step]==='hq';hsrc=((D.GM[D.guide[S.step]]||{}).s||[]).includes('hq')}
 else{hs=S.S.hq!=null;hsel=S.sel==='hq'}
 hq.className='hq'+(hs?' solved':!G&&S.T.hq&&S.T.hq.size?' tried':'')+(hsel?' sel':'')+(hsrc?' src':'');
 hq.innerHTML=`<span>How many H⁺ ions were pumped out of the membrane?</span><span class="v">${hs?(G?D.hq.ans:S.S.hq):''}</span>`;
 hq.setAttribute('aria-label','Final question: how many H plus ions were pumped out of the membrane'+(hs?', answer '+(G?D.hq.ans:S.S.hq):', blank'));
 $$('.bk').forEach(g=>{const go=()=>G?goto(D.gi[g.dataset.id]):choose(g.dataset.id);g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 if(G){const p=$('#gprev'),n=$('#gnext'),j=$('#jump');if(p)p.onclick=()=>goto(S.step-1);if(n)n.onclick=()=>goto(S.step+1);if(j)j.onchange=()=>goto(+j.value)}
 else{
  $$('[data-v]').forEach(x=>x.onclick=()=>answer(S.sel,x.dataset.v));
  const c=$('#chk'),inp=$('#ans');if(c){const go=()=>{const n=parseFloat(inp.value);if(isNaN(n)){S.msg='<div class="fb bad">Enter a number.</div>';render();return}answer(S.sel,String(n))};c.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
  const sh=$('#shw');if(sh)sh.onclick=()=>{const b=find(S.sel);if(!S.first[b.id])S.first[b.id]=-1;S.S[b.id]=b.ans;const ex=explain(b,b.ans,true);const t=b.k==='num'?whyOf(b):`${b.ans}. ${b.why}`;S.msg=`<div class="fb good"><b class="g">Answer: ${esc(b.ans)}.</b> ${t}</div>`;S.rg={tgt:ex.tgt,alt:[]};render()};
  const nx=$('#nxt');if(nx)nx.onclick=nextBlank}
 const hps=new Set(G?((D.GM[D.guide[S.step]]||{}).hp||[]):[]);$('#help').innerHTML=D.help.map((x,i)=>`<li${hps.has(i)?' class="hl"':''}>${esc(x)}</li>`).join('');
 $('#lay').innerHTML=D.text.map(x=>`<li>${esc(x)}</li>`).join('')+`<li>Blanks in reading order: ${D.B.map(b=>esc(b.d)).join('; ')}.</li>`}
$('#hq').onclick=()=>{if(gmode())goto(DG[cur].gi.hq);else choose('hq')};
$('#reset').onclick=()=>{const m=ST[cur].mode;ST[cur]=newS(m);render()};
document.addEventListener('keydown',e=>{if(!gmode()||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')goto(ST[cur].step+1);if(e.key==='ArrowLeft')goto(ST[cur].step-1)});
function tabs(){$('#tabs').innerHTML=['mito','chloro'].map(k=>`<button class="tab" role="tab" aria-selected="${k===cur}" data-k="${k}">${DG[k].name}</button>`).join('');
 $$('.tab[data-k]').forEach(t=>t.onclick=()=>{cur=t.dataset.k;tabs();render()})}
tabs();render();
</script></body></html>
