<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIOSC-020 Final Exam Review</title><meta name="theme-color" content="#17589B">
<meta name="description" content="Free study tool for the BIOSC-020 final exam: notes, flashcards, quiz, diagrams and drills.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2317589B%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3EB20%3C/text%3E%3C/svg%3E"><link rel="manifest" href="manifest.webmanifest">
<style>@font-face{font-family:"Carlito";src:url("fonts/Carlito-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Carlito";src:url("fonts/Carlito-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Carlito";src:url("fonts/Carlito-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--surface-2:#E8EDF2;--fg:#111A22;--muted:#4A5866;--line:#B9C6D2;
  --accent:#17589B;--accent-soft:#D9E8F7;--accent-ink:#FFFFFF;
  --good:#1F7A42;--good-soft:#DCF0E3;--bad:#B03A24;--bad-soft:#F8E1DB;--warn:#8A5A00;--warn-soft:#FBEFD0;
  --s1:#8A3F9E;--s2:#B34A12;--label:#B34A12;--label-ink:#FFFFFF;
  --sans:Carlito,Calibri,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --fs:1.0625rem;--lh:1.55;--ws:.06em;--ls:0;--r:12px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121B;--surface:#131D29;--surface-2:#1C2837;--fg:#EAF1F7;--muted:#A5B5C5;--line:#3A4B5E;
  --accent:#6DB6F2;--accent-soft:#1B3047;--accent-ink:#06121D;
  --good:#6FD39A;--good-soft:#16352A;--bad:#F29A85;--bad-soft:#40211A;--warn:#EBB65A;--warn-soft:#3A2E12;
  --s1:#D49AE6;--s2:#F2A36B;--label:#F2A36B;--label-ink:#1A1208;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B121B;--surface:#131D29;--surface-2:#1C2837;--fg:#EAF1F7;--muted:#A5B5C5;--line:#3A4B5E;
  --accent:#6DB6F2;--accent-soft:#1B3047;--accent-ink:#06121D;
  --good:#6FD39A;--good-soft:#16352A;--bad:#F29A85;--bad-soft:#40211A;--warn:#EBB65A;--warn-soft:#3A2E12;
  --s1:#D49AE6;--s2:#F2A36B;--label:#F2A36B;--label-ink:#1A1208;color-scheme:dark}
:root[data-size="s"]{--fs:.97rem}:root[data-size="l"]{--fs:1.2rem}:root[data-size="xl"]{--fs:1.38rem}
:root[data-space="roomy"]{--lh:1.8;--ws:.14em;--ls:.01em}
:root[data-space="double"]{--lh:2.1;--ws:.22em;--ls:.02em}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs);line-height:var(--lh);word-spacing:var(--ws);letter-spacing:var(--ls);overflow-wrap:break-word}
h1,h2,h3,h4{line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.45em;margin:.2em 0 .4em}h3{font-size:1.15em;margin:1.2em 0 .4em}
p{margin:.5em 0}ul{margin:.3em 0;padding-left:1.25em}li{margin:.2em 0}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:.88em}.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--fg);word-spacing:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;z-index:50}.skip:focus{top:8px}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 80px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 6px}
.brand{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand h1{font-size:1.2em}.brand .sub{display:block;font-size:.8em;color:var(--muted);font-weight:400}
.iconbtn{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 14px;font-weight:700;white-space:nowrap}
.tab[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px}
.fsum{flex:1;min-width:0;font-size:.88em;color:var(--muted)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:40px;padding:4px 10px;font-size:.92em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* filter drawer */
.filters{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.filters[hidden]{display:none}
.fgroup+.fgroup{margin-top:12px;border-top:2px solid var(--line);padding-top:10px}
.fhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.gtitle{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.85em;padding:6px 12px;border-radius:8px;color:#fff}
.gtitle.g1{background:var(--s1)}.gtitle.g2{background:var(--s2)}
:root[data-theme="dark"] .gtitle{color:#10151B}:root[data-theme="amoled"] .gtitle{color:#10151B}:root[data-theme="hc"] .gtitle{color:#10151B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gtitle{color:#10151B}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88em}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}

/* generic panels */
main{padding-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{font-size:.78em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pill{display:inline-block;font-size:.78em;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface-2);color:var(--muted);margin-right:4px}
.pill.g1{background:var(--s1);color:#fff}.pill.g2{background:var(--s2);color:#fff}
.note{font-size:.92em;color:var(--muted);border-left:4px solid var(--line);padding-left:10px;margin:.6em 0}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;border-left:6px solid var(--line);background:var(--surface-2)}
.fb.good{background:var(--good-soft);border-left-color:var(--good)}.fb.bad{background:var(--bad-soft);border-left-color:var(--bad)}.fb.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent)}
.score{font-weight:700;color:var(--accent)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{background:var(--surface-2);font-size:.85em}
table.mini{margin:.5em 0;font-size:.95em}

/* notes */
.topic{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:10px 0}
.topic>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;min-height:52px;font-weight:700}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::after{content:"+";margin-left:auto;font-size:1.4em;color:var(--accent);flex:none}
.topic[open]>summary::after{content:"\2212"}
.topic .tname{flex:1;min-width:0}
.tbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.tbody ul{list-style:none;padding:0;margin:.5em 0}
.tbody li{padding-left:1.1em;position:relative;margin:.35em 0}
.tbody li::before{content:"\2022";position:absolute;left:0;color:var(--accent);font-weight:700}
.tbody li.l1{margin-left:1.3em}.tbody li.l2{margin-left:2.6em}
.tbody li.l1::before{content:"\2013"}.tbody li.l2::before{content:"\00b7"}
.keynote{background:var(--warn-soft);border-left:6px solid var(--warn);padding:8px 12px;border-radius:8px;margin:.7em 0;font-weight:700}
.fignote{background:var(--accent-soft);border-left:6px solid var(--accent);padding:8px 12px;border-radius:8px;margin:.7em 0;font-size:.93em}
.fignote::before{content:"From the figure (supplemental). ";font-weight:700}
.para b{background:var(--good-soft);padding:0 4px;border-radius:4px}
.tact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* flashcards */
.card{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;position:relative;padding:34px 18px 40px;border:3px solid var(--accent);border-radius:16px;background:var(--surface);width:100%;font-size:1.2em}
.card.back{background:var(--accent);color:var(--accent-ink)}
.card .corner{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:.62em;font-weight:700;opacity:.85}
.card .hint{position:absolute;bottom:8px;font-size:.6em;opacity:.8}
.card .txt{max-width:36ch}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fcbtns .wide{grid-column:1/-1}

/* quiz and drills */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:48px;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-weight:700;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft);border-style:dashed}
.opt.ok::after{content:"\2713 correct";margin-left:auto;font-weight:700;color:var(--good);white-space:nowrap}
.opt.no::after{content:"\2717 your pick";margin-left:auto;font-weight:700;color:var(--bad);white-space:nowrap}
.qtext{font-size:1.1em;font-weight:700}
.dgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.dcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;min-height:110px}
.dcard:hover{border-color:var(--accent)}.dcard b{font-size:1.05em}.dcard span{color:var(--muted);font-size:.9em}
input[type=text],select{min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:1rem;max-width:100%}
input[type=text]{width:100%}
input.ok,select.ok{border-color:var(--good);background:var(--good-soft)}input.no,select.no{border-color:var(--bad);border-style:dashed;background:var(--bad-soft)}
.fill input[type=text]{width:9em;min-width:5em;margin:2px 3px}
.fill .num{font-size:.7em;vertical-align:super;font-weight:700;color:var(--accent)}
.fill{line-height:2.4}
.seq{font-weight:700;letter-spacing:.14em;word-spacing:.4em;font-size:1.15em}
.seq .a{color:#1d7a46}.seq .t,.seq .u{color:#b3382a}.seq .c{color:#2a62a8}.seq .g{color:#9a6208}
:root[data-theme="dark"] .seq .a{color:#6FD39A}:root[data-theme="dark"] .seq .t,:root[data-theme="dark"] .seq .u{color:#F29A85}:root[data-theme="dark"] .seq .c{color:#7FB2F0}:root[data-theme="dark"] .seq .g{color:#EBB65A}:root[data-theme="amoled"] .seq .a{color:#6FD39A}:root[data-theme="amoled"] .seq .t,:root[data-theme="amoled"] .seq .u{color:#F29A85}:root[data-theme="amoled"] .seq .c{color:#7FB2F0}:root[data-theme="amoled"] .seq .g{color:#EBB65A}:root[data-theme="hc"] .seq .a{color:#6FD39A}:root[data-theme="hc"] .seq .t,:root[data-theme="hc"] .seq .u{color:#F29A85}:root[data-theme="hc"] .seq .c{color:#7FB2F0}:root[data-theme="hc"] .seq .g{color:#EBB65A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seq .a{color:#6FD39A}:root:not([data-theme="light"]) .seq .t,:root:not([data-theme="light"]) .seq .u{color:#F29A85}:root:not([data-theme="light"]) .seq .c{color:#7FB2F0}:root:not([data-theme="light"]) .seq .g{color:#EBB65A}}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.diagram svg{display:block;width:100%;height:auto;max-width:100%}
svg text{font-family:var(--sans)}
.dframe{width:100%;border:0;display:block;height:calc(100vh - 210px);min-height:560px;background:var(--bg)}
.qrow{display:grid;grid-template-columns:1fr minmax(8em,12em);gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
@media (max-width:560px){.qrow{grid-template-columns:1fr}}

/* progress */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat .box{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:center}
.stat .box b{display:block;font-size:1.5em;color:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.prow{grid-template-columns:1fr 1fr}.prow .pn{grid-column:1/-1;font-weight:700}}
.settings{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.settings[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 24px}
@media (min-width:700px){.settings{align-items:center}.sheet{border-radius:16px}}
.sgroup{margin:14px 0}.sgroup>b{display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85em;color:var(--muted)}
.hot{outline:3px solid var(--good);outline-offset:1px}
@media (max-width:600px){.wrap{padding:0 10px 80px}h2{font-size:1.3em}.brand h1{font-size:1.05em}.panel{padding:12px}.card{min-height:210px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}

.hdr button,#btnSet{white-space:nowrap;flex:none}

:root[data-theme="amoled"]{
  --bg:#000;--surface:#080808;--surface-2:#131313;--fg:#EAF1F7;--muted:#A0AEBB;--line:#2C2C2C;
  --accent:#6DB6F2;--accent-soft:#10202F;--accent-ink:#000;
  --good:#6FD39A;--good-soft:#0C2219;--bad:#F29A85;--bad-soft:#2A120D;--warn:#EBB65A;--warn-soft:#241B08;
  --s1:#D49AE6;--s2:#F2A36B;--label:#F2A36B;--label-ink:#000;color-scheme:dark}
:root[data-theme="hc"]{
  --bg:#000;--surface:#000;--surface-2:#1A1A1A;--fg:#FFF;--muted:#E6E6E6;--line:#FFF;
  --accent:#FFE45C;--accent-soft:#2B2600;--accent-ink:#000;
  --good:#7CFFA8;--good-soft:#00330F;--bad:#FF9E94;--bad-soft:#4A0A04;--warn:#FFD54F;--warn-soft:#3A2D00;
  --s1:#F0B6FF;--s2:#FFB77A;--label:#FFD54F;--label-ink:#000;color-scheme:dark}
:root[data-theme="hc"] a{text-decoration:underline;text-decoration-thickness:2px}
:root[data-theme="hc"] .btn,:root[data-theme="hc"] .panel,:root[data-theme="hc"] .opt,:root[data-theme="hc"] .chip,:root[data-theme="hc"] .tab{border-width:2px}
:root[data-theme="hc"] :focus-visible{outline:3px solid #FFE45C;outline-offset:2px}

/* wide screens: left sidebar for the study modes, full-width content */
main p,main li,.qtext,.keynote,.fignote,.note{max-width:75ch}
@media (min-width:900px){
  .wrap{max-width:none;padding:0;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;align-items:start}
  .top{grid-column:1;grid-row:1/-1;position:sticky;top:0;height:100vh;overflow-y:auto;border-bottom:0;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
  .brand{display:contents}
  .brand h1{font-size:1.2em;line-height:1.25}
  .top nav{order:1}.tabs{flex-direction:column;overflow:visible;padding:0;gap:8px}
  .tab{width:100%;text-align:left;font-size:1.02em}
  #btnSet{order:2;margin-top:auto;width:100%}
  #fbar,#filters,#stepbar,#main,#nextbar,#foot{grid-column:2;margin-left:0;margin-right:0;padding-left:28px;padding-right:28px}
  #fbar{grid-row:1;padding-top:16px}
  #filters{grid-row:2}#filters:not([hidden]){margin:10px 28px;padding:10px;width:auto}
  #stepbar{grid-row:3}#main{grid-row:4;padding-bottom:24px}#nextbar{grid-row:5}
  #foot{grid-row:6;padding-bottom:60px}
  .dframe{height:calc(100vh - 150px)}
}

.steps{padding-left:1.4em}.steps li{margin:.6em 0;max-width:75ch}
.fbar[hidden]{display:none}.panel>h3:first-child{margin-top:0}

.autorow label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.autorow input[type=number]{width:7.5em;min-height:44px;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:1rem}

#btnLog{display:none}
@media (min-width:900px){
  #btnLog{display:block;order:2;margin-top:auto;width:100%}
  #btnSet{margin-top:0!important}
  #foot{display:none}
  #about .sheet{max-width:640px;border-radius:16px;margin:auto;max-height:85vh}
}

@media (min-width:900px){
  #tabs #fbar,.top #fbar{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0;margin:0;grid-column:auto;grid-row:auto}
  .top #fbar .btn{width:100%;text-align:left}
  .top #fbar .fsum{flex:none}
  .fbar.off .btn{opacity:.45}
  #filters:not([hidden]){margin-top:20px}
  #main{padding-top:24px}
}

.sidebtn{display:none}.tools{display:none}
@media (min-width:900px){
  .tools{display:flex;gap:8px;order:-1;align-items:center}
  #btnShow:not([hidden]){display:inline-flex;align-items:center;position:fixed;top:10px;left:10px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  html[data-side=hide] .wrap{grid-template-columns:0 minmax(0,1fr)}
  html[data-side=hide] .top{display:none}
  html[data-side=hide] #fbar{padding-left:132px}
  html[data-side=hide] #fbar[hidden]~#main{padding-top:72px}
}

/* colorful guide */
:root{--c1:#0E7C86;--c2:#2B63B0;--c3:#5A4DB5;--c4:#8A3F9E;--c5:#B03A8C;--c6:#2B63B0;--kink:#FFFFFF;--hg:linear-gradient(135deg,#D6F4EF 0%,#E6E1FA 55%,#D7E7F8 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#4FD1D9;--c2:#7FB0F5;--c3:#A9A3F5;--c4:#D49AE6;--c5:#F28FCB;--c6:#7FB0F5;--kink:#06121D;--hg:linear-gradient(135deg,#0F2B30 0%,#1F1B3D 55%,#10233D 100%)}}

<script>/* Concept notes. One entry per concept. Strings are bullets, strings starting with two spaces are sub-bullets,
   {k:"..."} is a highlighted exam note, {f:"..."} is a figure-only (supplemental) note, {html:"..."} is raw html.
   Slide numbers are the page numbers of the two final study guide PDFs (set 1 = old material, set 2 = new material). */
const GROUPS = [
 {set:1, title:"Set 1: old material", sub:"Study guide slide set 1 of 2"},
 {set:2, title:"Set 2: new material", sub:"Study guide slide set 2 of 2"}
];
const TOPICS = [
/* ================= SET 1 ================= */
{id:"s1-metric", set:1, name:"Metric prefixes and conversions", slides:"2", notes:[
 {k:"The exam has a partially filled out table with 12 blank spaces."},
 {html:`<table class="mini"><thead><tr><th>Metric prefix</th><th>Power of prefix</th><th>Conversion factor</th></tr></thead><tbody>
 <tr><td>giga- (G)</td><td>10<sup>9</sup></td><td>1 Gg = 10<sup>9</sup> g</td></tr>
 <tr><td>mega- (M)</td><td>10<sup>6</sup></td><td>1 Mg = 10<sup>6</sup> g</td></tr>
 <tr><td>kilo- (k)</td><td>10<sup>3</sup></td><td>1 kg = 10<sup>3</sup> g</td></tr>
 <tr><td>unit</td><td>10<sup>0</sup> or 1</td><td>1 gram</td></tr>
 <tr><td>milli- (m)</td><td>10<sup>-3</sup></td><td>1 mg = 10<sup>-3</sup> g</td></tr>
 <tr><td>micro- (µ)</td><td>10<sup>-6</sup></td><td>1 µg = 10<sup>-6</sup> g</td></tr>
 <tr><td>nano- (n)</td><td>10<sup>-9</sup></td><td>1 ng = 10<sup>-9</sup> g</td></tr></tbody></table>`},
 "Seven prefix rows, three columns each. Any of the prefix, power, or conversion factor cells can be blank."
]},
{id:"s1-science", set:1, name:"Basic vs applied science", slides:"3", notes:[
 "<b>Basic science</b>: seeks to expand knowledge regardless of the short-term application of that knowledge.",
 "  It is not focused on developing a product or a service of immediate public or commercial value.",
 "  The immediate goal of basic science is knowledge for knowledge's sake.",
 "<b>Applied science</b>: aims to use science to solve real-world problems.",
 "  Examples on the slide: improve a crop yield, find a cure for a particular disease, or save animals threatened by a natural disaster."
]},
{id:"s1-philic", set:1, name:"Hydrophilic and hydrophobic molecules", slides:"4", notes:[
 "<b>Hydrophilic</b> (\"water loving\"): molecules that DO MIX with H<sub>2</sub>O.",
 "  Contain polar covalent bonds or charges (anions / cations).",
 "  Examples: ions (Na<sup>+</sup>, Cl<sup>-</sup>), nucleic acids (DNA and RNA), and all water-soluble proteins.",
 "<b>Hydrophobic</b> (\"water fearing\"): molecules that DON'T MIX with H<sub>2</sub>O.",
 "  Contain non-polar covalent bonds.",
 "  Examples: lipids and non-polar proteins.",
 {f:"Figures on the slide: NaCl dissolved in H₂O, DNA surrounded by H₂O, a soluble protein surrounded by H₂O, and oil separating from H₂O."}
]},
{id:"s1-water", set:1, name:"Water properties from hydrogen bonds", slides:"5", notes:[
 "H<sub>2</sub>O properties due to H-bonds provide the cellular environment.",
 "<b>Solvency</b>: dissolves salts.",
 "<b>Adhesion and cohesion</b>",
 "  <b>Cohesion</b>: water attracted to water.",
 "  <b>Adhesion</b>: water attracted to polar surfaces.",
 "<b>High heat capacity</b>: absorbs heat without changing temperature."
]},
{id:"s1-ph", set:1, name:"pH and the pH scale", slides:"6", notes:[
 "The pH scale is a simplified way to indicate the number of H<sup>+</sup> ions in solution.",
 "Ranges from 0 to 14.",
 "  pH below 7 is <b>acidic</b>.",
 "  pH above 7 is <b>basic</b>.",
 "  pH of 7 is <b>neutral</b>."
]},
{id:"s1-buffers", set:1, name:"Physiological buffers", slides:"7", notes:[
 "Physiological buffers reduce changes in pH.",
 "<b>Intracellular</b> pH is regulated by the <b>phosphate</b> buffer system: H<sub>2</sub>PO<sub>4</sub><sup>-</sup> / HPO<sub>4</sub><sup>2-</sup>.",
 "<b>Blood</b> pH is regulated by the <b>bicarbonate</b> buffer system: CO<sub>2</sub> + H<sub>2</sub>O ⇌ H<sub>2</sub>CO<sub>3</sub> ⇌ HCO<sub>3</sub><sup>-</sup> + H<sup>+</sup>.",
 {k:"The exam will not test specific knowledge of the chemical equations."}
]},
{id:"s1-metab", set:1, name:"Monomers, polymers and metabolism", slides:"8", notes:[
 "Cells use monomers from the diet to build polymers for function.",
 "<b>Metabolism</b>: the sum of all chemical reactions in the body.",
 "<b>Catabolism</b>: breaking down larger molecules into smaller ones.",
 "<b>Anabolism</b>: the metabolic process of building larger molecules from smaller ones.",
 {f:"Figure: catabolism example is glycogen to glucose, breakdown releases energy (ATP for muscle contraction and neuron function, GTP for protein synthesis and cell signaling). Anabolism example is amino acids to a polypeptide (protein), a synthesis that takes up energy."}
]},
{id:"s1-dogma", set:1, name:"Transcription and translation: the flow of information", slides:"9", notes:[
 "The flow of genetic information is summarized as <b>DNA → RNA → protein</b>.",
 "Each gene along a DNA molecule directs synthesis of a messenger RNA (mRNA).",
 "  DNA is <b>transcribed</b> into RNA.",
 "The mRNA molecule interacts with the cell's protein-synthesizing machinery to direct production of a polypeptide.",
 "  RNA is <b>translated</b> into amino acids at the ribosome."
]},
{id:"s1-genes", set:1, name:"Genes, gene expression, template strand", slides:"10 to 11", notes:[
 "<b>Gene</b>: a region of DNA that contains information to make a functional molecule, typically a protein or RNA.",
 "<b>Gene expression</b>: a gene is said to be expressed when the information in the gene is turned into a function.",
 "<b>Transcription</b>: synthesis of mRNA from DNA.",
 "<b>Translation</b>: synthesis of a protein from mRNA.",
 "<b>Template strand</b>: the DNA strand that is transcribed into mRNA.",
 "<b>Non-template (coding) strand</b>: the DNA strand that is not transcribed into mRNA."
]},
{id:"s1-rnapol", set:1, name:"Three RNA polymerases in eukaryotes", slides:"12", notes:[
 "<b>RNA polymerase I</b>: ribosomal RNA (rRNA) genes.",
 "<b>RNA polymerase II</b>: protein-coding genes (messenger RNA or mRNA).",
 "<b>RNA polymerase III</b>: transfer RNA (tRNA) genes."
]},
{id:"s1-trna", set:1, name:"tRNA, ribosomes, codons and anticodons", slides:"13 to 15", notes:[
 "Translation in eukaryotes requires <b>transfer RNA (tRNA)</b>. tRNAs are RNA molecules that carry amino acids.",
 "Ribosomes couple the tRNA anticodon to the mRNA codon.",
 "  Ribosomal RNAs (rRNAs) and proteins make up the large and small subunits.",
 "  rRNAs catalyze the peptide bond between two amino acids.",
 "  The small subunit facilitates codon-anticodon coupling during protein synthesis.",
 "  mRNA has a codon triplet. tRNA has an anticodon triplet.",
 "tRNA transfers amino acids to the growing polypeptide in a ribosome.",
 "  Each tRNA carries a specific amino acid on its 3' end.",
 "  Each tRNA has an anticodon that base-pairs with a complementary codon on mRNA.",
 "  tRNA molecules translate mRNA messages into amino acids using codon-anticodon pairing."
]},
{id:"s1-protein", set:1, name:"Levels of protein structure", slides:"16", notes:[
 "<b>Primary</b>: linear, unbranched amino acid sequence linked by covalent peptide bonds.",
 "<b>Secondary</b>: portions of the polypeptide form alpha helices or beta pleated sheets due to H-bonds in the protein.",
 "<b>Tertiary</b>: overall 3-dimensional shape caused by amino acid R-group interactions.",
 "<b>Quaternary</b>: more than one polypeptide chain, caused by amino acid R-group interactions."
]},
{id:"s1-dest", set:1, name:"Protein destinations and ribosome populations", slides:"17 to 18", notes:[
 "Three locations where proteins can end up: <b>inside the cell</b> (cytosol), <b>secreted</b> from the cell, or in a <b>membrane</b>.",
 "Ribosomes carry out protein synthesis. Two populations in the cell:",
 "  <b>Free ribosomes</b> in the cytosol: synthesize proteins that function in the cytosol (the solution inside the cell).",
 "  <b>Bound ribosomes</b> attached to the endoplasmic reticulum (ER): make membrane proteins and proteins that are secreted from the cell.",
 {f:"Figure: inside-the-cell proteins come from free ribosomes. Secreted and membrane proteins come from ribosomes on the ER, travel by vesicle to the Golgi apparatus, then by vesicle to the plasma membrane."}
]},
{id:"s1-insglu", set:1, name:"Secreted proteins: insulin and glucagon", slides:"19", notes:[
 "The pancreas synthesizes two important cell signaling molecules.",
 "<b>Insulin</b>: a protein synthesized by beta cells of the pancreas.",
 "  Lowers blood glucose.",
 "  Causes cellular uptake of glucose from the blood stream.",
 "<b>Glucagon</b>: a protein synthesized by alpha cells of the pancreas.",
 "  Raises blood glucose.",
 "  Causes cellular release of glucose into the blood stream."
]},
{id:"s1-endo", set:1, name:"Endomembrane system", slides:"20 to 21", notes:[
 "<b>Rough ER</b>",
 "  Continuous with the nuclear envelope.",
 "  Studded with ribosomes.",
 "  Facilitates protein folding in the lumen.",
 "  Sends transport vesicles to the Golgi apparatus.",
 "<b>Smooth ER</b>",
 "  Continuous with the rough ER.",
 "  No ribosomes.",
 "  Synthesizes phospholipids for the cell membrane.",
 "  Stores Ca<sup>2+</sup>.",
 "<b>Golgi apparatus</b>",
 "  Receives vesicles from the ER.",
 "  Attaches polysaccharides to proteins (glycosylation).",
 "  Sorts and repackages proteins for the new destination: secreted proteins or plasma membrane proteins."
]},
{id:"s1-mut", set:1, name:"Point mutations: silent, missense, nonsense", slides:"22 to 24", notes:[
 "Mutations are nucleotide changes in the DNA of a cell.",
 "<b>Nucleotide-pair substitution</b>: replaces one nucleotide and its partner with another pair of nucleotides.",
 "  In the <b>promoter</b>: gene expression is affected.",
 "  In an <b>intron</b>: gene expression and protein sequence are unaffected.",
 "  In an <b>exon</b>: the amino acid sequence may be affected, with three outcomes:",
 "    <b>Silent</b> mutations code for the same amino acid.",
 "    <b>Missense</b> mutations code for an incorrect amino acid.",
 "    <b>Nonsense</b> mutations change an amino acid codon into a stop codon. Most lead to a nonfunctional protein.",
 {k:"Slide 24 practice: transcribe and translate each template DNA. Use the codon wheel (genetic code) on the slide. Answers below, mRNA written 5' to 3'."},
 {html:`<table class="mini"><thead><tr><th>Template DNA</th><th>mRNA</th><th>a.a. sequence</th><th>Result</th></tr></thead><tbody>
 <tr><td>5'-CTACCCTTTACAGGG-3'</td><td>5'-CCCUGUAAAGGGUAG-3'</td><td>Pro-Cys-Lys-Gly-Stop</td><td>reference</td></tr>
 <tr><td>5'-CTACCCTTT<b>G</b>CAGGG-3'</td><td>5'-CCCUG<b>C</b>AAAGGGUAG-3'</td><td>Pro-Cys-Lys-Gly-Stop</td><td>silent</td></tr>
 <tr><td>5'-CTACCCTTT<b>C</b>CAGGG-3'</td><td>5'-CCCUG<b>G</b>AAAGGGUAG-3'</td><td>Pro-<b>Trp</b>-Lys-Gly-Stop</td><td>missense</td></tr>
 <tr><td>5'-CTACCCTTT<b>T</b>CAGGG-3'</td><td>5'-CCCUG<b>A</b>AAAGGGUAG-3'</td><td>Pro-<b>Stop</b></td><td>nonsense</td></tr></tbody></table>`},
 {f:"The mRNA is complementary and antiparallel to the template, so it reads 5' to 3' as the reverse complement of the template."}
]},
{id:"s1-cycle", set:1, name:"Human life cycle", slides:"25", notes:[
 "<b>Zygote</b> (fertilized egg) = 2n (diploid). The zygote develops into an adult through <b>mitosis</b>.",
 "<b>Adult</b> = 2n (diploid).",
 "<b>Gametes</b> (sperm and egg) are the only type of human cells produced by <b>meiosis</b>. Gametes are 1n (haploid).",
 "<b>Fertilization</b>: when gametes fuse to form a zygote."
]},
{id:"s1-genet", set:1, name:"Genetics terminology", slides:"26", notes:[
 "<b>Alleles</b>: alternate versions of a gene.",
 "  Diploid organisms have two alleles for each gene.",
 "  A dominant allele masks a recessive allele.",
 "  A dominant allele is indicated by an uppercase letter. A recessive allele is indicated by a lowercase letter.",
 "<b>Genotype</b>: genetic makeup of the organism.",
 "  <b>Homozygous</b>: identical alleles. Homozygous dominant (AA). Homozygous recessive (aa).",
 "  <b>Heterozygous</b>: different alleles (Aa).",
 "<b>Phenotype</b>: physical appearance of the organism, determined by genotype."
]},
{id:"s1-ar", set:1, name:"Autosomal recessive disease", slides:"27", notes:[
 "Disease is caused by a <b>recessive</b> allele. Two copies of the recessive allele are required to be affected.",
 "  Examples: cystic fibrosis and sickle cell disease.",
 "<b>Carrier</b>: an individual who carries one recessive allele. Carriers have the diseased allele but are not affected, because they have the healthy dominant allele.",
 {html:`<table class="mini"><thead><tr><th>Possible offspring genotype</th><th>Probability</th><th>Affected by cystic fibrosis?</th></tr></thead><tbody>
 <tr><td>AA</td><td>¼</td><td>No</td></tr><tr><td>Aa</td><td>½</td><td>No</td></tr><tr><td>aa</td><td>¼</td><td>Yes</td></tr></tbody></table>`},
 {f:"The probabilities on the slide come from a cross of two carriers (Aa × Aa)."}
]},
{id:"s1-ad", set:1, name:"Autosomal dominant disease", slides:"28", notes:[
 "Disease is caused by a <b>dominant</b> allele. Only one copy of the dominant allele is required to be affected.",
 "  Example: Huntington's disease.",
 {html:`<table class="mini"><thead><tr><th>Possible offspring genotype</th><th>Probability</th><th>Affected by Huntington's?</th></tr></thead><tbody>
 <tr><td>HH</td><td>¼</td><td>Yes</td></tr><tr><td>Hh</td><td>½</td><td>Yes</td></tr><tr><td>hh</td><td>¼</td><td>No</td></tr></tbody></table>`},
 {f:"The probabilities on the slide come from a cross of two heterozygotes (Hh × Hh)."}
]},
{id:"s1-chrom", set:1, name:"Chromatin, histones and nucleosomes", slides:"29 to 30", notes:[
 "<b>Chromatin</b> is a complex of DNA and histone proteins.",
 "  <b>Euchromatin</b> is open DNA that can be transcribed.",
 "  <b>Heterochromatin</b> is tightly wound DNA that cannot be transcribed.",
 "<b>Nucleosomes</b> consist of histone proteins.",
 "  Provide structural support to DNA.",
 "  Affect gene expression (epigenetics).",
 {f:"Figure: a histone octamer is made of core histones (H2A, H2B, H3, H4) with DNA wrapped around it. Histone tails and epigenetic marks such as methyl groups can change how tightly the chromatin is packed."}
]},

/* ================= SET 2 ================= */
{id:"s2-enz", set:2, name:"Enzymes, substrate, active site, induced fit", slides:"2 to 3", notes:[
 "Enzymes catalyze reactions. The enzyme active site binds the substrate with high specificity.",
 "<b>Substrate</b>: the reactant that an enzyme acts on.",
 "  While bound, the catalytic activity of the enzyme converts substrate to product.",
 "<b>Active site</b>: region on the enzyme, often a pocket or groove, that binds to the substrate.",
 "<b>Induced fit</b>: when the substrate binds, the enzyme changes shape to improve substrate fit for catalysis.",
 "<b>Conformational shape change</b>: any alteration in a protein's 3D shape."
]},
{id:"s2-ea", set:2, name:"Transition state and activation energy", slides:"4 to 5", notes:[
 "Chemical reactions between molecules involve breaking and forming bonds.",
 "<b>Transition state</b>: the molecule becomes unstable enough to break bonds.",
 "<b>Activation energy (E<sub>A</sub>)</b>: the initial energy needed to break the bonds of the reactants.",
 "Enzymes use a variety of mechanisms to <b>lower E<sub>A</sub></b>:",
 "  1. Amino acid <b>R-groups</b> in the active site may participate in the reaction.",
 "  2. Substrates may be <b>oriented</b> to facilitate the reaction.",
 "  3. Substrates may be <b>stretched</b> to make the bonds easier to break.",
 "The Na<sup>+</sup>/K<sup>+</sup> ATPase reduces E<sub>A</sub> for ATP breakdown."
]},
{id:"s2-energy", set:2, name:"Exergonic and endergonic reactions", slides:"6", notes:[
 "Energy release is about chemical bond changes.",
 "<b>Exergonic reaction</b>: energy releasing process.",
 "  Products have <b>stronger</b> chemical bonds than reactants.",
 "<b>Endergonic reaction</b>: energy consuming process.",
 "  Products have <b>weaker</b> chemical bonds than reactants.",
 {f:"Figure: ATP → ADP + P is the exergonic example (energy released, ΔG less than 0). ADP + P → ATP is the endergonic example (energy required, ΔG greater than 0)."}
]},
{id:"s2-pump", set:2, name:"Na⁺/K⁺ ATPase pump, six steps and practice paragraph", slides:"7 to 9", notes:[
 "The Na<sup>+</sup>/K<sup>+</sup> ATPase pump uses ATP to move <b>3 Na<sup>+</sup> out</b> and <b>2 K<sup>+</sup> in</b>.",
 "<b>Phosphorylation</b>: a phosphate group is added to another molecule, often a protein or sugar.",
 "<b>Dephosphorylation</b>: a phosphate group is removed.",
 {k:"Steps to know:"},
 "  Step 1: Three Na<sup>+</sup> bind to the ion binding site.",
 "  Step 2: The substrate, ATP, binds and is hydrolyzed to ADP and P. This leads to pump phosphorylation.",
 "  Step 3: Conformational shape change of the protein leads to release of Na<sup>+</sup> to the extracellular side.",
 "  Step 4: K<sup>+</sup> binds to the ion binding site.",
 "  Step 5: Pump dephosphorylation occurs.",
 "  Step 6: Conformational shape change of the protein leads to release of K<sup>+</sup> to the cytoplasmic side.",
 {k:"Practice fill-in-the-blank exam question (slide 9). Answers are in bold. Try the Drills tab version first."},
 {html:`<p class="para">The first step of the pump cycle begins when three <b>Na<sup>+</sup></b> ions bind to specific ion-binding sites on the pump. In the second step, the substrate, <b>ATP</b>, binds the Na<sup>+</sup>/K<sup>+</sup> pump at a specific groove known as the <b>active site</b>. The pump changes shape to improve substrate fit in a theory known as <b>induced fit</b>. ATP is <b>hydrolyzed</b> to ADP + P, and the phosphate group attaches to the pump in a process known as <b>phosphorylation</b>. This reaction is an <b>exergonic</b> reaction because it releases energy. The pump uses a variety of mechanisms to lower the <b>activation energy</b> required for ATP hydrolysis: 1) Amino acid <b>R-groups</b> in the active site may participate in the reaction, 2) Substrates may be <b>oriented</b> to facilitate the reaction, and 3) Substrates may be <b>stretched</b> to make bonds easier to break.</p>
 <p class="para">The third step involves a <b>conformational shape change</b> of the protein. This releases three <b>Na<sup>+</sup></b> ions across the membrane to the <b>extracellular</b> side. In the fourth step, 2 <b>K<sup>+</sup></b> ions bind to the pump. The fifth step is the removal of the phosphate group in a process known as <b>dephosphorylation</b>. The sixth step involves another <b>conformational shape change</b> of the protein, leading to the pump releasing two <b>K<sup>+</sup></b> ions to the <b>cytoplasmic</b> side. The Na<sup>+</sup>/K<sup>+</sup> pump restarts the cycle.</p>`}
]},
{id:"s2-redox", set:2, name:"Redox: gaining and losing electrons", slides:"10", notes:[
 "During cellular respiration, <b>glucose is oxidized</b> and <b>O<sub>2</sub> is reduced</b>.",
 "Transfer of electrons (e<sup>-</sup>) between reactants is an oxidation-reduction (redox) reaction.",
 "  Oxidation and reduction occur together.",
 "  <b>Oxidation</b>: loss of e<sup>-</sup> or H from a substance.",
 "  <b>Reduction</b>: addition (gain) of e<sup>-</sup> or H to a substance.",
 "<b>OIL RIG</b>: Oxidation Is Loss, Reduction Is Gain (of e<sup>-</sup> or H)."
]},
{id:"s2-mito", set:2, name:"Mitochondrion anatomy", slides:"11", notes:[
 "The <b>matrix</b> is where pyruvate oxidation and the citric acid cycle occur.",
 "The <b>inner membrane</b> is where the electron transport chain and ATP synthase are located.",
 {f:"Figure: mitochondrion with outer membrane, inner membrane, intermembrane space and matrix. See the Diagrams tab to label it."}
]},
{id:"s2-stages", set:2, name:"Four stages of cellular respiration", slides:"12", notes:[
 "Harvesting energy from glucose by cellular respiration has four stages:",
 "  1. <b>Glycolysis</b>: splits 1 glucose into 2 pyruvate and sends e<sup>-</sup> to the ETC.",
 "  2. <b>Pyruvate oxidation</b>: converts 2 pyruvate into 2 acetyl-CoA.",
 "  3. <b>Citric acid cycle (CAC)</b>: converts 2 acetyl-CoA into 4 CO<sub>2</sub> and sends e<sup>-</sup> to the ETC.",
 "  4. <b>Electron transport chain (ETC)</b>: uses e<sup>-</sup> from carriers to synthesize ATP.",
 {f:"Figure: glycolysis happens in the cytosol. Pyruvate oxidation, the citric acid cycle, and the ETC with ATP synthase happen in the mitochondrion. Electrons travel to the ETC via NADH, and via NADH and FADH₂ from the citric acid cycle."}
]},
{id:"s2-etc", set:2, name:"Electron transport chain", slides:"13 to 14", notes:[
 "The ETC consists of proteins embedded in the <b>mitochondrial inner membrane</b>.",
 "  NADH and FADH<sub>2</sub> pass e<sup>-</sup> to the ETC, where they are transferred in a series of redox reactions, each releasing a small amount of energy.",
 "  The energy yielded is used to <b>pump H<sup>+</sup> into the intermembrane space</b>.",
 "  <b>Oxygen is the final e<sup>-</sup> acceptor</b>. It captures 2 e<sup>-</sup> and 2 H<sup>+</sup> to form H<sub>2</sub>O.",
 "Electrons are passed to electron carriers (NAD<sup>+</sup> and FAD) rather than directly to O<sub>2</sub>.",
 "  NAD<sup>+</sup> can accept 2 e<sup>-</sup>. NADH is carrying 2 e<sup>-</sup>.",
 "  FAD can accept 2 e<sup>-</sup>. FADH<sub>2</sub> is carrying 2 e<sup>-</sup>. (The slide abbreviates these as FADH.)",
 {f:"Figure: protein complexes I to IV, with Q and cytochrome c moving electrons. NADH gives up its electrons at complex I and FADH₂ at complex II. H⁺ is pumped across the inner membrane."}
]},
{id:"s2-atps", set:2, name:"ATP synthase and oxidative phosphorylation", slides:"15 to 16", notes:[
 "ATP synthase catalyzes phosphorylation of ADP to ATP in the presence of O<sub>2</sub>. This is termed <b>oxidative phosphorylation</b>.",
 "H<sup>+</sup> flows down its concentration gradient through ATP synthase to drive ADP phosphorylation to ATP.",
 "The high [H<sup>+</sup>] in the <b>intermembrane space</b> flows through ATP synthase into the <b>matrix</b>.",
 "The energy from H<sup>+</sup> flowing through ATP synthase is used to phosphorylate ADP to ATP.",
 "Because oxygen is used in the process that initially builds the H<sup>+</sup> gradient responsible for ATP synthase activity, the addition of a phosphate to ADP is called oxidative phosphorylation."
]},
{id:"s2-endo", set:2, name:"Endosymbiosis theory", slides:"17", notes:[
 "Evidence of endosymbiosis (mitochondria and chloroplasts):",
 "  They have <b>double membranes</b>.",
 "  They have their own <b>ribosomes</b>.",
 "  They have their own <b>DNA</b>.",
 "  Their genomes are <b>circular</b>."
]},
{id:"s2-wall", set:2, name:"Plant cell walls and cellulose", slides:"18", notes:[
 "Cellulose is a major component of plant cell walls.",
 "<b>Primary cell walls</b>",
 "  Contain cellulose.",
 "  The wall stretches when the cell is growing.",
 "<b>Secondary cell walls</b>",
 "  Contain cellulose.",
 "  Contain <b>lignin</b> for strength.",
 "  Form inside the primary cell wall.",
 "  Produced after the cell completes growth.",
 "<b>Middle lamella</b>",
 "  Contains <b>pectin</b> between two cells.",
 "  Provides adhesion."
]},
{id:"s2-tissue", set:2, name:"Plant tissue systems", slides:"19", notes:[
 "<b>Dermal tissue</b> serves as a protective outer coating.",
 "  <b>Guard cells</b>: specialized epidermal cells that facilitate gas exchange in leaves.",
 "<b>Vascular tissue</b> facilitates transport of materials and provides mechanical support.",
 "  <b>Xylem</b> transports water and minerals.",
 "  <b>Phloem</b> transports sucrose.",
 "<b>Ground tissue</b>: tissue that is neither dermal nor vascular.",
 "  Includes cells specialized for storage, photosynthesis, and support."
]},
{id:"s2-xylem", set:2, name:"Xylem and phloem cell types", slides:"20", notes:[
 "<b>Vessels</b>: wide cells found in the xylem.",
 "  Efficient at transporting water and minerals.",
 "  Dead at maturity.",
 "<b>Tracheids</b>: narrow cells found in the xylem.",
 "  Less efficient at transporting water and minerals.",
 "  Dead at maturity.",
 "<b>Sieve-tube elements</b>: sugar-conducting cells of the phloem.",
 "  Alive at maturity."
]},
{id:"s2-photo", set:2, name:"Photosynthesis overview", slides:"21", notes:[
 "Chloroplasts convert light energy (absorbed by pigments) to chemical energy in carbohydrates.",
 "6 H<sub>2</sub>O + 6 CO<sub>2</sub> → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub>",
 "<b>Water is oxidized, CO<sub>2</sub> is reduced.</b>"
]},
{id:"s2-chloro", set:2, name:"Chloroplast structure", slides:"22 to 23", notes:[
 "Photosynthesis occurs in the <b>thylakoids and stroma</b>.",
 "Plants and algae contain chloroplasts, which contain pigment molecules.",
 "<b>Three-membrane system</b>",
 "  <b>Double membrane</b> enclosing the <b>stroma</b>.",
 "  <b>Thylakoids</b> form the third (innermost) membrane.",
 "The thylakoid membrane contains pigments (chlorophyll a/b, xanthophyll, carotene) that capture solar energy.",
 "  The <b>thylakoid space</b> is within this membrane.",
 {f:"Figure: thylakoids stack into grana. The thylakoid lumen is the same space as the thylakoid space."}
]},
{id:"s2-light", set:2, name:"Light reactions: photosystems, ETC, ATP synthase", slides:"24 to 26", notes:[
 "<b>Membrane organization</b>: PSII (photosystem 2), PSI (photosystem 1), the ETC, and ATP synthase are all in the <b>thylakoid membrane</b>.",
 "Electrons pass from <b>PSII → ETC → PSI → NADP<sup>+</sup></b>.",
 "  As electrons move through the ETC, energy is extracted. That energy is used to pump H<sup>+</sup> into the thylakoid space.",
 "  NADP<sup>+</sup> accepts electrons to produce <b>NADPH</b>.",
 "<b>ATP production</b>: H<sup>+</sup> flows from the thylakoid space to the stroma, through ATP synthase, to phosphorylate ADP to ATP.",
 "<b>Pathway of e<sup>-</sup></b>",
 "  <b>Photosystem II</b>: e<sup>-</sup> supplied by hydrolysis (splitting water). Releases O<sub>2</sub> as a byproduct. Light energizes electrons.",
 "  <b>Electron transport chain</b>: e<sup>-</sup> supplied by PSII. Redox reactions slowly release energy from e<sup>-</sup>. Energy from e<sup>-</sup> is used to pump H<sup>+</sup> into the thylakoid space.",
 "  <b>Photosystem I</b>: e<sup>-</sup> supplied by the ETC. Light energizes electrons. e<sup>-</sup> and H<sup>+</sup> combine with NADP<sup>+</sup> to become NADPH."
]},
{id:"s2-calvin", set:2, name:"Calvin cycle and G3P", slides:"27", notes:[
 "ATP and NADPH are used to reduce CO<sub>2</sub> to G3P in three steps.",
 "<b>1. CO<sub>2</sub> fixation</b>",
 "  3 CO<sub>2</sub> are fixed (attached) to 3 RuBP by <b>rubisco</b> (enzyme).",
 "  A 6-carbon molecule is split into two 3-carbon molecules (3PG).",
 "<b>2. CO<sub>2</sub> reduction</b>",
 "  6 ATP used.",
 "  6 NADPH used.",
 "  Forms 1× G3P.",
 "<b>3. Regeneration of RuBP</b>",
 "  3 ATP used.",
 "  5× G3P used to reform 3× RuBP (a 5-carbon molecule).",
 "<b>G3P is an important building block.</b> Plants and algae synthesize the following from G3P: amino acids, triglycerides, glucose, sucrose, starch, and cellulose.",
 {f:"Adding the steps: 6 ATP + 3 ATP = 9 ATP and 6 NADPH for each turn that fixes 3 CO₂ and nets 1 G3P. This sum is arithmetic from the slide numbers."}
]},
{id:"s2-rmp", set:2, name:"Resting membrane potential", slides:"28 to 29", notes:[
 "The Na<sup>+</sup>/K<sup>+</sup> pump establishes concentration gradients and leads to the resting membrane potential.",
 "<b>Potential difference</b>: voltage difference between two points due to separated electrical charges.",
 "<b>Resting membrane potential</b>: the potential difference across the plasma membrane of a neuron at rest.",
 "  <b>-70 millivolts</b>.",
 "  The negative sign means the inside of the neuron is negative compared to the outside.",
 "  Maintained by the sodium-potassium pump, which actively transports <b>3 Na<sup>+</sup> outside</b> the axon and <b>2 K<sup>+</sup> inside</b>.",
 "  The charge difference (inside of the axon negative compared to outside) is due to unequal ion distribution."
]},
{id:"s2-neuron", set:2, name:"Neuron anatomy", slides:"30 to 31", notes:[
 "<b>Dendrites</b>: receive information, typically through neurotransmitters.",
 "<b>Cell body (soma)</b>: contains the nucleus and ribosomes.",
 "<b>Axon</b>: propagates the action potential to the axon terminal.",
 "<b>Axon terminal</b>: end of the axon. Releases neurotransmitters onto the target cell."
]},
{id:"s2-channels", set:2, name:"Voltage-gated Na⁺ and K⁺ channels", slides:"32 to 33", notes:[
 "Two voltage-gated membrane proteins propagate the action potential and are located along the axon.",
 "<b>Na<sup>+</sup> channel</b>: allows Na<sup>+</sup> to pass through the membrane <b>into</b> the cell. The interior of the membrane becomes <b>positive</b>.",
 "<b>K<sup>+</sup> channel</b>: allows K<sup>+</sup> to pass through the membrane <b>out of</b> the cell. The interior of the membrane becomes <b>negative</b>.",
 "Opening and closing of the voltage-gated Na<sup>+</sup> and K<sup>+</sup> ion channels gives rise to the action potential.",
 "<b>Action potential</b>: a rapid change in membrane potential."
]},
{id:"s2-ap", set:2, name:"Action potential and its phases", slides:"34 to 36", notes:[
 "Action potentials are measured in millivolts (mV) at a point along the axon, using an electrode.",
 "<b>Action potential (the nerve impulse)</b>: a rapid, short-lived reversal in charge difference across the membrane.",
 "  Occurs down the length of the axon.",
 "  The electrical signal is propagated by Na<sup>+</sup> and K<sup>+</sup> channels.",
 "Specific terms describe the direction of changes in membrane potential relative to the resting membrane potential (RMP) in an excitable cell:",
 "  1. <b>Resting</b>: the neuron establishes a negative membrane potential using Na<sup>+</sup>/K<sup>+</sup> pumps (3 Na<sup>+</sup> out, 2 K<sup>+</sup> in).",
 "  2. <b>Depolarization</b>: potential moves from RMP to a positive membrane potential using voltage-gated Na<sup>+</sup> channels. <b>Na<sup>+</sup> influx</b>.",
 "  3. <b>Repolarization</b>: potential returns to the RMP using voltage-gated K<sup>+</sup> channels. <b>K<sup>+</sup> efflux</b>.",
 "  4. <b>Hyperpolarization</b>: potential becomes more negative than the RMP using voltage-gated K<sup>+</sup> channels. <b>K<sup>+</sup> efflux</b>.",
 "  5. <b>Resting</b>: the neuron reestablishes RMP using Na<sup>+</sup>/K<sup>+</sup> pumps (3 Na<sup>+</sup> out, 2 K<sup>+</sup> in).",
 {f:"Graph on slide 34: membrane potential (mV) against time. Depolarization is the rising line, repolarization is the falling line, hyperpolarization is the dip below resting, then the potential returns to rest. The graph's vertical axis runs from -100 to +50 mV."}
]},
{id:"s2-synapse", set:2, name:"The synapse and Ca²⁺ channels", slides:"37 to 38", notes:[
 "The terminal of one neuron (<b>presynaptic cell</b>) lies close to a dendrite of another neuron (<b>postsynaptic cell</b>).",
 "  The region between the neurons is called the <b>synaptic cleft</b>.",
 "  A synapse includes the pre- and postsynaptic membranes and the synaptic cleft.",
 "Action potentials do not cross the cleft.",
 "<b>Voltage-gated Ca<sup>2+</sup> channels</b> on the presynaptic membrane promote release of neurotransmitter-filled vesicles.",
 {f:"Figure sequence: 1) action potential reaches the terminal, 2) voltage-gated Ca²⁺ channels open, 3) calcium enters the axon terminal, 4) neurotransmitter is released and diffuses across the cleft, 5) it binds to receptors on the postsynaptic cell, 6) neurotransmitter is removed from the cleft."}
]},
{id:"s2-drugs", set:2, name:"Drugs and the synapse", slides:"39 to 40", notes:[
 "Many drugs affect the nervous system by interfering with or promoting the action of neurotransmitters.",
 "  <b>Stimulants</b> increase activity of the CNS.",
 "  <b>Depressants</b> decrease activity of the CNS.",
 "A drug can:",
 "  <b>Block transmitter uptake</b>. Example: cocaine prevents recycling of dopamine by the presynaptic neuron.",
 "  <b>Mimic the action of a neurotransmitter</b>.",
 "    Natural opioids: endorphins.",
 "    Synthetic opioids: morphine, Vicodin, fentanyl."
]}
];

const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const strip=h=>String(h).replace(/<[^>]+>/g,'');
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9+\- ]/g,'').replace(/\s+/g,' ').trim();

const tShort=id=>{const t=topicById[id];return t?t.name:id};

let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}},200)}

function applySettings(){
  const h=document.documentElement,s=P.set;
  if(s.theme==="auto")h.removeAttribute("data-theme");else h.setAttribute("data-theme",s.theme);
  h.dataset.size=s.size;h.dataset.space=s.space;
  if(s.motion==="reduce")h.dataset.motion="reduce";else h.removeAttribute("data-motion");
  const f=$("#dframe");if(f&&f.contentWindow)try{f.contentWindow.postMessage({type:"theme",theme:themeNow()},"*")}catch(e){}
}
const themeNow=()=>P.set.theme==="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):P.set.theme;
matchMedia("(prefers-color-scheme:dark)").addEventListener&&matchMedia("(prefers-color-scheme:dark)").addEventListener("change",applySettings);
function openSettings(){
  const o=(k,v,l)=>`<button data-k="${k}" data-v="${v}" aria-pressed="${P.set[k]===v}">${l}</button>`;

/* ===== topic filter ===== */
function renderFilters(){
  const f=$("#filters");
  f.innerHTML=GROUPS.map(G=>{const ts=TOPICS.filter(t=>t.set===G.set);const on=ts.filter(t=>sel.has(t.id)).length;
    return `<div class="fgroup"><div class="fhead"><span class="gtitle g${G.set}">${G.title}</span><button class="btn sm" data-g="${G.set}" data-a="all">Select all</button><button class="btn sm" data-g="${G.set}" data-a="none">None</button><span class="small muted">${on} of ${ts.length}</span></div>
    <div class="chips">${ts.map(t=>`<button class="chip" data-id="${t.id}" aria-pressed="${sel.has(t.id)}">${esc(t.name)}</button>`).join("")}</div></div>`}).join("")+
    `<div class="row" style="margin-top:12px"><button class="btn sm" data-g="0" data-a="all">Everything</button><button class="btn primary sm" id="fclose">Done</button></div>`;
  const n=sel.size;$("#fsum").textContent=n===TOPICS.length?`All ${n} concepts`:n===0?"No concepts selected":`${n} of ${TOPICS.length} concepts`;
  $("#fcount").textContent=n===TOPICS.length?"All":n;
}
$("#filters").addEventListener("click",e=>{
  if(e.target.id==="fclose"){$("#filters").hidden=true;$("#btnFilt").setAttribute("aria-expanded","false");$("#btnFilt").focus();return}
  const c=e.target.closest(".chip");
  if(c){sel.has(c.dataset.id)?sel.delete(c.dataset.id):sel.add(c.dataset.id)}
  const a=e.target.closest("[data-a]");
  if(a){const g=+a.dataset.g;TOPICS.forEach(t=>{if(g===0||t.set===g){a.dataset.a==="all"?sel.add(t.id):sel.delete(t.id)}})}
  if(c||a){saveSel();renderFilters();deck=null;qstate=null;render()}
});
document.addEventListener("click",e=>{if(e.target.closest("[data-openfilt]")){$("#filters").hidden=false;$("#btnFilt").setAttribute("aria-expanded","true");scrollTo({top:0});$("#filters").scrollIntoView({block:"start"})}});
$("#btnFilt").onclick=()=>{const h=$("#filters").hidden=!$("#filters").hidden;$("#btnFilt").setAttribute("aria-expanded",String(!h))};
function only(id){sel.clear();sel.add(id);saveSel();renderFilters();deck=null;qstate=null}

/* ===== notes ===== */
function noteHTML(t){
  let out="",open=false;
  const close=()=>{if(open){out+="</ul>";open=false}};
  t.notes.forEach(n=>{
    if(typeof n==="string"){if(!open){out+="<ul>";open=true}const m=n.match(/^( *)/)[1].length/2;out+=`<li class="${m?"l"+m:""}">${n.trim()}</li>`}
    else{close();if(n.k)out+=`<div class="keynote">${n.k}</div>`;else if(n.f)out+=`<div class="fignote">${n.f}</div>`;else if(n.html)out+=`<div class="tblw">${n.html}</div>`}
  });close();return out;
}
let openT=new Set(P.fold||[]);
function renderNotes(){
  const ts=TOPICS.filter(t=>sel.has(t.id));
  let h=`<h2>Notes</h2><p class="muted small">One section per concept, written from the typed text of both study guides. Slide numbers match the PDFs. Yellow boxes are exam notes. Blue boxes come from figures, which the guide says are supplemental.</p>`;
  if(!ts.length)h+=`<div class="panel">No concepts selected. Use <b>Choose concepts</b> above.</div>`;
  else h+=`<div class="row"><button class="btn sm" id="nOpen">Open all</button><button class="btn sm" id="nShut">Close all</button></div>`;
  GROUPS.forEach(G=>{const g=ts.filter(t=>t.set===G.set);if(!g.length)return;
    h+=`<h3><span class="gtitle g${G.set}">${G.title}</span></h3>`+g.map(t=>`<details class="topic" id="n-${t.id}" ${openT.has(t.id)?"open":""}><summary><span class="pill g${t.set}">Slide${/to/.test(t.slides)?"s":""} ${t.slides}</span><span class="tname">${t.name}</span></summary><div class="tbody">${noteHTML(t)}
    <div class="tact"><button class="btn sm" data-p="cards" data-id="${t.id}">Flashcards for this</button><button class="btn sm" data-p="quiz" data-id="${t.id}">Quiz on this</button>${t.id==="s2-mito"||t.id==="s2-chloro"||t.id==="s2-stages"||t.id==="s2-light"||t.id==="s2-calvin"||t.id==="s2-etc"||t.id==="s2-atps"?`<button class="btn sm" data-p="diagrams">Open the diagrams</button>`:""}</div></div></details>`).join("");

}
$("#main").addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("topic")){const id=d.id.slice(2);d.open?openT.add(id):openT.delete(id);P.fold=[...openT];save()}},true);
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="nOpen"){TOPICS.forEach(t=>openT.add(t.id));P.fold=[...openT];save();renderNotes()}
  if(b.id==="nShut"){openT.clear();P.fold=[];save();renderNotes()}
  if(b.dataset.p){if(b.dataset.id)only(b.dataset.id);go(b.dataset.p)}

/* ===== flashcards ===== */
let deck=null,pos=0,flipped=false,cOnlyAgain=false;
function buildDeck(shuf){deck=CARDS.filter(c=>sel.has(c.t)&&(!cOnlyAgain||P.cards[c.id]==="again"));if(shuf)deck=shuffle(deck);pos=0;flipped=false}
let playing=false,autoT=0;
const AU=()=>P.auto||(P.auto={q:5,a:5,loop:1});
function stopAuto(){playing=false;clearTimeout(autoT)}
function autoStep(){
  if(!playing)return;if(cur!=="cards"||document.hidden||!deck||!deck.length){stopAuto();if(cur==="cards")renderCards();return}
  if(!flipped){flipped=true}
  else if(pos>=deck.length-1&&!AU().loop){stopAuto();autoDone=true;renderCards();return}
  else{pos=(pos+1)%deck.length;flipped=false}
  renderCards();
}
let autoDone=false;
function resched(){clearTimeout(autoT);if(playing)autoT=setTimeout(autoStep,(flipped?AU().a:AU().q)*1000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing){stopAuto();if(cur==="cards")renderCards()}});
function autoPanel(){
  const u=AU(),d=playing?"disabled":"";
  return `<div class="panel" id="autop"><h3>Play through the cards</h3>
  <p class="small muted">Shows each question, flips to the answer, then moves to the next card. Set how many seconds to spend on each side. Change the times while paused.</p>
  <div class="row autorow"><label>Seconds on question <input type="number" id="aQ" min="1" max="120" step="1" inputmode="numeric" value="${u.q}" ${d}></label>
  <label>Seconds on answer <input type="number" id="aA" min="1" max="120" step="1" inputmode="numeric" value="${u.a}" ${d}></label></div>
  <div class="row"><label class="row" style="gap:8px"><input type="checkbox" id="aLoop" ${u.loop?"checked":""} ${d} style="width:24px;height:24px"> Start over at the end</label></div>
  <div class="row"><button class="btn primary" id="cPlay" aria-pressed="${playing}">${playing?"Pause":"Play"}</button><span class="small muted" aria-live="polite">${playing?"Playing. Tap the card or use Previous and Next to take over.":autoDone?"Reached the last card.":""}</span></div></div>`;
}
function renderCards(){
  if(!deck)buildDeck(false);
  const k=Object.values(P.cards).filter(v=>v==="know").length,a=Object.values(P.cards).filter(v=>v==="again").length;
  let h=`<h2>Flashcards</h2><div class="row"><label class="row" style="gap:8px"><input type="checkbox" id="cAgain" ${cOnlyAgain?"checked":""} style="width:24px;height:24px"> Only cards marked "Review again"</label></div>`;
  if(!deck.length){stopAuto();h+=`<div class="panel">${cOnlyAgain?"No cards are marked Review again in these concepts.":"No cards in the selected concepts."}</div>`;$("#main").innerHTML=h;return}
  if(pos>=deck.length)pos=0;const c=deck[pos],m=P.cards[c.id];
  h+=`<p class="small muted" aria-live="polite">Card ${pos+1} of ${deck.length}${m?` (marked: ${m==="know"?"got it":"review again"})`:""}. Tap the card or press Space to flip. Swipe or use the arrow keys to move.</p>
  <div class="meter" aria-hidden="true"><i style="width:${(pos+1)/deck.length*100}%"></i></div><p></p>
  <div class="card ${flipped?"back":""}" id="card" tabindex="0" role="button" aria-label="Flashcard. ${flipped?"Answer side":"Question side"}. Press Space to flip."><div class="corner"><span>${esc(tShort(c.t))}</span><span>${flipped?"answer":"question"}</span></div><div class="txt">${flipped?c.b:c.f}</div><div class="hint">${flipped?"tap to see the question":"tap to see the answer"}</div></div>
  <div class="fcbtns"><button class="btn" id="cPrev">Previous</button><button class="btn" id="cNext">Next</button><button class="btn primary" id="cKnow">Got it</button><button class="btn" id="cAgainB">Review again</button><button class="btn wide ghost" id="cShuf">Shuffle deck</button></div>
  <p class="small muted">Marked so far across all cards: ${k} got it, ${a} review again, ${CARDS.length-k-a} unmarked.</p>`+autoPanel();
  $("#main").innerHTML=h;resched();
}
function cflip(){autoDone=false;flipped=!flipped;renderCards();const c=$("#card");c&&c.focus({preventScroll:true})}
function cmove(d){autoDone=false;if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;flipped=false;renderCards();const c=$("#card");c&&c.focus({preventScroll:true})}
function cmark(v){if(!deck.length)return;P.cards[deck[pos].id]=v;save();if(cOnlyAgain&&v==="know"){buildDeck(false);flipped=false;renderCards();return}cmove(1)}
$("#main").addEventListener("click",e=>{
  if(cur!=="cards")return;const t=e.target;
  if(t.closest("#card"))cflip();else if(t.id==="cPrev")cmove(-1);else if(t.id==="cNext")cmove(1);else if(t.id==="cKnow")cmark("know");else if(t.id==="cAgainB")cmark("again");
  else if(t.id==="cShuf"){buildDeck(true);renderCards()}
  else if(t.id==="cPlay"){if(playing)stopAuto();else{playing=true;autoDone=false}renderCards()}
});
$("#main").addEventListener("change",e=>{const i=e.target;if(i.id==="cAgain"){cOnlyAgain=i.checked;buildDeck(false);renderCards()}
  else if(i.id==="aQ"||i.id==="aA"){let v=Math.round(+i.value);if(!(v>=1))v=5;v=Math.min(120,v);i.value=v;AU()[i.id==="aQ"?"q":"a"]=v;save()}
  else if(i.id==="aLoop"){AU().loop=i.checked?1:0;save()}});
$("#main").addEventListener("keydown",e=>{
  if(cur!=="cards"||document.activeElement.id!=="card")return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();cflip()}else if(e.key==="ArrowRight"){e.preventDefault();cmove(1)}else if(e.key==="ArrowLeft"){e.preventDefault();cmove(-1)}
});
let tx=null;
$("#main").addEventListener("touchstart",e=>{if(e.target.closest("#card"))tx=e.touches[0].clientX},{passive:true});
$("#main").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)cmove(dx<0?1:-1)},{passive:true});

/* ===== quiz ===== */
let qstate=null,qOnlyMissed=false;
function buildQuiz(){
  let pool=QUIZ.filter(q=>sel.has(q.t));
  if(qOnlyMissed)pool=pool.filter(q=>P.quiz[q.id]&&P.quiz[q.id].last===0);
  qstate={pool:shuffle(pool),i:0,right:0,done:0,missed:[],ans:null};
}
function renderQuiz(){
  if(!qstate)buildQuiz();const S=qstate;
  let h=`<h2>Quiz</h2><label class="row" style="gap:8px"><input type="checkbox" id="qMissed" ${qOnlyMissed?"checked":""} style="width:24px;height:24px"> Only questions I missed last time</label>`;
  if(!S.pool.length){$("#main").innerHTML=h+`<div class="panel">${qOnlyMissed?"No missed questions in these concepts yet.":"No questions in the selected concepts."}</div>`;return}
  if(S.i>=S.pool.length){
    h+=`<div class="panel"><h3>Finished</h3><p class="score">${S.right} of ${S.pool.length} correct</p>${S.missed.length?`<p>Review these:</p><ul>${S.missed.map(q=>`<li><b>${esc(tShort(q.t))}</b>: ${q.q}<br><span class="muted">Answer: ${q.a}</span></li>`).join("")}</ul>`:"<p>No misses. Nice run.</p>"}<div class="row"><button class="btn primary" id="qAgain">New round</button>${S.missed.length?`<button class="btn" id="qRetry">Retry the ones I missed</button>`:""}</div></div>`;
    $("#main").innerHTML=h;return}
  const q=S.pool[S.i];if(!q.opts)q.opts=shuffle([q.a,...q.w]);
  const A=S.ans;
  h+=`<p class="small muted" aria-live="polite">Question ${S.i+1} of ${S.pool.length}. Score so far: ${S.right} of ${S.done}.</p><div class="meter" aria-hidden="true"><i style="width:${S.i/S.pool.length*100}%"></i></div>
  <div class="panel"><span class="pill g${topicById[q.t].set}">${esc(tShort(q.t))}</span><p class="qtext" id="qq">${q.q}</p><div class="opts" role="group" aria-labelledby="qq">${q.opts.map((o,i)=>{
    let c="";if(A){if(o===q.a)c="ok";else if(A.pick===o)c="no"}
    return `<button class="opt ${c}" data-o="${i}" ${A?"disabled":""}><span class="k">${String.fromCharCode(65+i)}.</span><span>${o}</span></button>`}).join("")}</div>
  ${A?`<div class="fb ${A.ok?"good":"bad"}" role="status"><b>${A.ok?"Correct.":"Not quite."}</b> ${A.ok?"":`The answer is ${q.a}. `}${q.e}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="qNext">${S.i+1>=S.pool.length?"See results":"Next question"}</button></div>`:""}</div>`;
  $("#main").innerHTML=h;
  if(A){const nb=$("#qNext");nb&&nb.focus({preventScroll:true})}
}
$("#main").addEventListener("click",e=>{
  if(cur!=="quiz")return;const S=qstate,t=e.target;
  const o=t.closest(".opt");
  if(o&&S&&!S.ans){const q=S.pool[S.i],pick=q.opts[+o.dataset.o],ok=pick===q.a;S.ans={pick,ok};S.done++;if(ok)S.right++;else S.missed.push(q);recQuiz(q.id,ok);renderQuiz()}
  else if(t.id==="qNext"){S.i++;S.ans=null;renderQuiz();window.scrollTo({top:0})}
  else if(t.id==="qAgain"){buildQuiz();renderQuiz()}
  else if(t.id==="qRetry"){const m=S.missed;qstate={pool:shuffle(m),i:0,right:0,done:0,missed:[],ans:null};m.forEach(x=>x.opts=null);renderQuiz()}
});
$("#main").addEventListener("change",e=>{if(e.target.id==="qMissed"){qOnlyMissed=e.target.checked;buildQuiz();renderQuiz()}});

/* ================= 7. Genetics probability trainer ================= */
function drillGen(host){
  let mode="ar",q=null;
  function gam(g){return [g[0],g[1]]}
  function sortG(a,b,L,l){const x=[a,b].sort((p,q)=>(p===L?0:1)-(q===L?0:1));return x.join("")}
  function newQ(first){
    const L=mode==="ar"?"A":"H",l=L.toLowerCase(),opts=[L+L,L+l,l+l];
    let p1,p2;if(first){p1=p2=L+l}else{p1=pick(opts);p2=pick(opts)}
    const kids=[];gam(p1).forEach(a=>gam(p2).forEach(b=>kids.push(sortG(a,b,L,l))));
    const aff=mode==="ar"?kids.filter(k=>k===l+l).length/4:kids.filter(k=>k!==l+l).length/4;
    const carr=kids.filter(k=>k===L+l).length/4;
    q={L,l,p1,p2,kids,aff,carr,unaff:1-aff};render()}
  function render(){
    const dis=mode==="ar"?"autosomal recessive disease (cystic fibrosis style)":"autosomal dominant disease (Huntington's style)";
    const qs=mode==="ar"?[["aff","Probability a child is affected"],["carr","Probability a child is a carrier"]]:[["aff","Probability a child is affected"],["unaff","Probability a child is unaffected"]];
    host.innerHTML=`<div class="row"><button class="btn ${mode==="ar"?"primary":""}" data-m="ar">Autosomal recessive</button><button class="btn ${mode==="ad"?"primary":""}" data-m="ad">Autosomal dominant</button></div>
    <div class="panel"><p class="note">${dis}. In a recessive disease, ${q.l+q.l} is affected and ${q.L+q.l} is a carrier. In a dominant disease, ${q.L+q.L} and ${q.L+q.l} are affected.</p><p class="qtext">Parents: ${q.p1} × ${q.p2}</p>
    ${qs.map(x=>`<div class="qrow"><label for="g-${x[0]}">${x[1]}</label><input type="text" id="g-${x[0]}" data-k="${x[0]}" inputmode="text" autocomplete="off" placeholder="1/4, ¼, 0.25 or 25%"></div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="btn primary" id="gck">Check and show Punnett square</button><button class="btn" id="gnx">New cross</button></div><div id="gfb"></div></div><div id="gterm"></div>`;
    $("#gck",host).onclick=()=>{let s=0;$$("input",host).forEach(i=>{const v=parseFrac(i.value),ok=v!=null&&Math.abs(v-q[i.dataset.k])<1e-9;i.className=ok?"ok":"no";if(ok)s++});recDrill("genetics",s,qs.length);
      const cnt={};q.kids.forEach(k=>cnt[k]=(cnt[k]||0)+1);
      $("#gfb",host).innerHTML=fbBox(s===qs.length,`<b>${s} of ${qs.length}.</b> Affected: ${fmtFrac(q.aff)}, ${mode==="ar"?"carrier: "+fmtFrac(q.carr):"unaffected: "+fmtFrac(q.unaff)}.`)+
      `<div class="tblw"><table class="mini" aria-label="Punnett square"><thead><tr><th></th><th>${q.p2[0]}</th><th>${q.p2[1]}</th></tr></thead><tbody><tr><th>${q.p1[0]}</th><td>${sortG(q.p1[0],q.p2[0],q.L,q.l)}</td><td>${sortG(q.p1[0],q.p2[1],q.L,q.l)}</td></tr><tr><th>${q.p1[1]}</th><td>${sortG(q.p1[1],q.p2[0],q.L,q.l)}</td><td>${sortG(q.p1[1],q.p2[1],q.L,q.l)}</td></tr></tbody></table></div><p class="small muted">Counts: ${Object.entries(cnt).map(([k,v])=>`${k} ${v}/4`).join(", ")}.</p>`};
    $("#gnx",host).onclick=()=>newQ(false);
    matchTable($("#gterm",host),{id:"gen-terms",title:"Genetics terms",opts:["Homozygous dominant","Homozygous recessive","Heterozygous"],items:[["AA",0],["aa",1],["Aa",2],["HH",0],["hh",1],["Hh",2],["Identical alleles, both dominant",0],["Different alleles",2]]});
  }
  host.addEventListener("click",e=>{const m=e.target.dataset.m;if(m&&m!==mode){mode=m;newQ(true)}});
  newQ(true);
}

/* ================= 8. Missed-items mixer ================= */
function drillMixer(host){
  let S=null,timer=null,timed=false;
  function weight(q){const d=P.quiz[q.id];if(!d)return 2;return 1+(d.last===0?4:0)+Math.round((1-d.r/d.t)*3)}
  function start(){
    const qp=QUIZ.filter(q=>sel.has(q.t)),cp=CARDS.filter(c=>sel.has(c.t)&&P.cards[c.id]==="again");
    const items=[];const bag=[];qp.forEach(q=>{for(let i=0;i<weight(q);i++)bag.push(q)});
    const used=new Set();while(items.length<Math.min(8,qp.length)&&bag.length){const q=pick(bag);if(!used.has(q.id)){used.add(q.id);items.push({k:"q",q,opts:shuffle([q.a,...q.w])})}if(used.size>=qp.length)break}
    shuffle(cp).slice(0,3).forEach(c=>items.push({k:"c",c}));
    S={items:shuffle(items),i:0,right:0,done:0,ans:null,rev:false};draw()}
  function draw(){clearInterval(timer);
    if(!S){host.innerHTML=`<div class="panel"><h3>What this is</h3><p>A mixed round built from your own results. It pulls from two modes at once: Quiz questions and Flashcards.</p><ol class="steps"><li><b>Only your chosen concepts.</b> It draws only from concepts selected in Choose concepts. ${whereChoose()} Right now ${sel.size} of ${TOPICS.length} are selected, which gives ${QUIZ.filter(q=>sel.has(q.t)).length} quiz questions and ${CARDS.filter(c=>sel.has(c.t)&&P.cards[c.id]==="again").length} flashcards marked "Review again".</li><li><b>Quiz questions lean toward what you missed.</b> Up to 8 are picked. Questions you got wrong, or got wrong last time, are much more likely to come up. Ones you never tried are included too, and ones you always get right show up least.</li><li><b>Flashcards are only the ones you marked "Review again".</b> Up to 3 are added as self-graded recall. Cards you marked Got it are left out.</li><li><b>Your answers count.</b> Missing a question makes it more likely next round. Answering it right makes it less likely. Marking a recall card Got it takes it out of the pile.</li></ol></div><div class="panel"><p>A round is up to 11 items.</p><label class="row" style="gap:8px"><input type="checkbox" id="mt" style="width:24px;height:24px" ${timed?"checked":""}> Show a 45 second countdown (off by default)</label><div class="row" style="margin-top:10px"><button class="btn primary" id="ms">Start a round</button></div></div>`;
      $("#ms",host).onclick=()=>{timed=$("#mt",host).checked;start()};return}
    if(S.i>=S.items.length){host.innerHTML=`<div class="panel"><h3>Round complete</h3><p class="score">${S.right} of ${S.done} correct</p><div class="row"><button class="btn primary" id="mr">Another round</button></div></div>`;$("#mr",host).onclick=()=>{S=null;start()};recDrill("mixer",S.right,S.done);return}
    const it=S.items[S.i];let h=`<p class="small muted" aria-live="polite">Item ${S.i+1} of ${S.items.length}. Score: ${S.right} of ${S.done}.${timed&&!S.ans&&!S.rev?` <b id="mclock">45</b> s left.`:""}</p><div class="meter" aria-hidden="true"><i style="width:${S.i/S.items.length*100}%"></i></div>`;
    if(it.k==="q"){const q=it.q;h+=`<div class="panel"><span class="pill g${topicById[q.t].set}">${esc(tShort(q.t))}</span><p class="qtext" id="mq">${q.q}</p><div class="opts">${it.opts.map((o,i)=>{let c="";if(S.ans){if(o===q.a)c="ok";else if(S.ans.pick===o)c="no"}return `<button class="opt ${c}" data-o="${i}" ${S.ans?"disabled":""}><span class="k">${String.fromCharCode(65+i)}.</span><span>${o}</span></button>`}).join("")}</div>${S.ans?fbBox(S.ans.ok,`<b>${S.ans.ok?"Correct.":S.ans.pick==null?"Time is up.":"Not quite."}</b> ${S.ans.ok?"":"The answer is "+q.a+". "}${q.e}`)+`<div class="row" style="margin-top:10px"><button class="btn primary" id="mn">Next</button></div>`:""}</div>`}
    else{const c=it.c;h+=`<div class="panel"><span class="pill g${topicById[c.t].set}">${esc(tShort(c.t))}</span> <span class="pill">Recall</span><p class="qtext">${c.f}</p>${S.rev?`<div class="fb">${c.b}</div><p>Did you get it?</p><div class="row"><button class="btn primary" id="mg">Got it</button><button class="btn" id="mw">Not yet</button></div>`:`<button class="btn primary" id="mrv">Show the answer</button>`}</div>`}
    host.innerHTML=h;
    if(timed&&!S.ans&&!S.rev){let t=45;timer=setInterval(()=>{t--;const c=$("#mclock",host);if(c)c.textContent=t;if(t<=0){clearInterval(timer);if(it.k==="q"&&!S.ans){S.ans={pick:null,ok:false};S.done++;recQuiz(it.q.id,false);draw()}}},1000)}
  }
  host.addEventListener("click",e=>{if(!S)return;const it=S.items[S.i];if(!it)return;const t=e.target;
    const o=t.closest(".opt");
    if(o&&it.k==="q"&&!S.ans){const pick=it.opts[+o.dataset.o],ok=pick===it.q.a;S.ans={pick,ok};S.done++;if(ok)S.right++;recQuiz(it.q.id,ok);draw();const n=$("#mn",host);n&&n.focus({preventScroll:true})}
    else if(t.id==="mn"){S.i++;S.ans=null;S.rev=false;draw()}
    else if(t.id==="mrv"){S.rev=true;clearInterval(timer);draw()}
    else if(t.id==="mg"||t.id==="mw"){const ok=t.id==="mg";S.done++;if(ok){S.right++;P.cards[it.c.id]="know";save()}S.i++;S.rev=false;draw()}});
  S=null;draw();
}
